# =====================================================================
# activity-trade 生产部署 Nginx 示例
# 用途：托管 portal/admin 两个静态前端 dist，并把 /api 反向代理到后端
# 说明：将 frontend/portal/dist 与 frontend/admin/dist 的产物拷贝到
#       /var/www/activity-trade/{portal,admin} 后生效；limit_req 示意限流。
# =====================================================================

worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 请求全局限速（示例）：单 IP 20 r/s，突发 40（配合后端应用层限流做第一道防护）
    limit_req_zone $binary_remote_addr zone=seckill:10m rate=20r/s;

    upstream activity_backend {
        # 单实例；多实例部署时在此追加 server，建议配合微服务/网关层
        server 127.0.0.1:8080;
        keepalive 64;
    }

    server {
        listen       80;
        server_name  localhost;

        # ---- 后端 API ----
        location /api/ {
            # 秒杀入口单独限速；其他 /api 接口不限（示例）
            location = /api/seckill/order { limit_req zone=seckill burst=40 nodelay; }
            proxy_pass http://activity_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
        }

        # ---- 管理端（admin，端口 5174 构建产物） ----
        location /admin/ {
            alias /var/www/activity-trade/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # ---- 用户端（portal，端口 5273 构建产物） ----
        location / {
            root /var/www/activity-trade/portal/;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}