# =====================================================================
# 参考 compose：全新环境一键起本项目中件。
# 【注意】本开发机（Windows）已复用现有服务，无需执行本文件：
#   - MySQL  ：本机原生 MySQL 8.0.42，端口 3306，root/1234
#   - Redis  ：现有容器 redis7（redis:7-alpine），6379，requirepass 123456
#   - RocketMQ：现有容器 ticket-ai-namesrv / ticket-ai-broker（5.3.1），9876/10911
# 若在全新 Linux/Mac 环境使用本文件，按此模板起服务并保持密码一致。
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: activity-trade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: activity-trade-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "--no-auth-warning", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RocketMQ 参考（多容器，5.x）。本机已有 ticket-ai-namesrv / ticket-ai-broker，按需注释避免端口冲突。
  # namesrv:
  #   image: apache/rocketmq:5.3.1
  #   container_name: activity-trade-namesrv
  #   ports: ["9876:9876"]
  #   command: sh mqnamesrv
  # broker:
  #   image: apache/rocketmq:5.3.1
  #   container_name: activity-trade-broker
  #   depends_on: [namesrv]
  #   ports: ["10909:10909", "10911:10911"]
  #   environment:
  #     NAMESRV_ADDR: namesrv:9876
  #   command: sh mqbroker -n namesrv:9876

volumes:
  mysql-data:
  redis-data: